<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SME Record — Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="./img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/admin-login.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>SME Record</h1>
      <p>Restricted access — authorised personnel only</p>
      <div class="admin-badge"><i class="fa-solid fa-lock"></i> Admin Portal</div>
    </div>

    <div class="alert" id="alert"></div>

    <div class="form-group">
      <label for="adminUsername">Admin Username</label>
      <div class="input-wrap">
        <i class="fa-solid fa-user-shield"></i>
        <input type="text" id="adminUsername" placeholder="Enter your username" autocomplete="username" />
      </div>
    </div>

    <div class="form-group">
      <label for="adminPwd">Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="adminPwd" placeholder="Admin password" autocomplete="current-password" />
        <button class="toggle-pwd" type="button" data-action="toggleAdminPwd" aria-label="Toggle password visibility">
          <i class="fa-solid fa-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button class="btn" id="loginBtn" data-action="adminLogin">
      Sign In to Admin Panel
    </button>

    <a class="back-link" href="auth.html">
      <i class="fa-solid fa-arrow-left"></i> Back to main app
    </a>

    <div class="security-note">
      <i class="fa-solid fa-shield-halved"></i>
      All admin actions are logged and monitored
    </div>
  </div>
  <script src="api.js"></script>
  <script src="js/adminLogin.js"></script>
</body>

</html>
