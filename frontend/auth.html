<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SME Record — Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="./img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo"><i class="fa-solid fa-book-open"></i></div>
      <h1>SME Record</h1>
      <p>Business ledger for smart owners</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Sign In</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <!-- Alert Box (shared) -->
    <div class="alert" id="authAlert"></div>

    <!-- LOGIN FORM -->
    <div class="form-panel active" id="loginPanel">
      <div class="form-group">
        <label for="loginBusiness">Business Name</label>
        <div class="input-wrap">
          <i class="fa-solid fa-briefcase"></i>
          <input type="text" id="loginBusiness" placeholder="Enter your business name" />
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Enter your password" />
          <button class="toggle-password" data-toggle-pwd="loginPassword" aria-label="Toggle password visibility">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="forgot-link"><a href="forgot-password.html">Forgot password?</a></div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADUaCGag1zuSTT_3" data-callback="onLoginTurnstile"
        data-theme="light"></div>
      <button class="btn-primary" id="loginBtn">
        Sign In
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div class="form-panel" id="registerPanel">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="regName" placeholder="Your full name" />
        </div>
      </div>

      <div class="form-group">
        <label for="regBusiness">Business Name</label>
        <div class="input-wrap">
          <i class="fa-solid fa-briefcase"></i>
          <input type="text" id="regBusiness" placeholder="Name of your business" />
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="regEmail" placeholder="your-email@email.com" />
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword" placeholder="Strong password" />
          <button class="toggle-password" data-toggle-pwd="regPassword" aria-label="Toggle password visibility">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="regConfirm">Confirm Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regConfirm" placeholder="Repeat your password" />
        </div>
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADUaCGag1zuSTT_3" data-callback="onRegisterTurnstile"
        data-theme="light"></div>
      <button class="btn-primary" id="registerBtn">
        Create Account
      </button>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
